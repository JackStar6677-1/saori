services:
  saori-whatsapp:
    build:
      context: ./integrations/whatsapp
      dockerfile: Dockerfile
    container_name: saori-whatsapp
    restart: unless-stopped
    network_mode: "host"
    environment:
      - STAR_MEMORY_URL=${STAR_MEMORY_URL:-http://127.0.0.1:8077}
      - ADMIN_PHONE_NUMBERS=${ADMIN_PHONE_NUMBERS:-56900000000}
      - WHATSAPP_STAFF_GROUP_JID=${WHATSAPP_STAFF_GROUP_JID:-your_group_jid@g.us}
      - AUTH_DIR=/app/data/auth_info
    volumes:
      - saori_whatsapp_auth:/app/data/auth_info
      - ./integrations/whatsapp:/app/src
      - /tmp:/tmp

  saori-discord:
    build:
      context: ./integrations/discord
      dockerfile: Dockerfile
    container_name: saori-discord
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - ./integrations/discord:/app/src
      - /tmp:/tmp

volumes:
  saori_whatsapp_auth:
