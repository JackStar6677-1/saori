<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="45%" stop-color="#0c0e17" />
      <stop offset="85%" stop-color="#111322" />
      <stop offset="100%" stop-color="#05060a" />
    </linearGradient>

    <!-- SAORI SRE Sovereign Neon Gradient -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="25%" stop-color="#ec4899" />
      <stop offset="55%" stop-color="#a855f7" />
      <stop offset="80%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Core Radial Aura -->
    <radialGradient id="coreAura" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#3b82f6" stop-opacity="0.30" />
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Glassmorphic Card Fill -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2238" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0d101d" stop-opacity="0.90" />
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="sreGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#252a44" stroke-width="0.8" stroke-opacity="0.35" />
      <circle cx="48" cy="48" r="1.2" fill="#a855f7" fill-opacity="0.45" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="hyperGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; letter-spacing: 8px; }
    .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; letter-spacing: 2.5px; }
    .tagline { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; letter-spacing: 0.6px; }
    .code-text { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: 600; }
    .badge-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 700; }
    .badge-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="500" fill="url(#bgGradient)" />

  <!-- SRE Grid -->
  <rect width="1200" height="500" fill="url(#sreGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="600" cy="175" r="320" fill="url(#coreAura)" />
  <circle cx="120" cy="80" r="190" fill="url(#coreAura)" opacity="0.25" />
  <circle cx="1080" cy="420" r="210" fill="url(#coreAura)" opacity="0.30" />

  <!-- Central Autonomous Core Emblem -->
  <g transform="translate(600, 110)" filter="url(#hyperGlow)">
    <!-- Radar Rings -->
    <circle cx="0" cy="0" r="68" fill="none" stroke="url(#primaryGlow)" stroke-width="1.8" stroke-dasharray="10 6" opacity="0.75" />
    <circle cx="0" cy="0" r="54" fill="none" stroke="#06b6d4" stroke-width="1.2" opacity="0.5" />
    <circle cx="0" cy="0" r="40" fill="none" stroke="#ec4899" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />

    <!-- Autonomous Diamond Hexagon -->
    <polygon points="0,-38 32.9,-19 32.9,19 0,38 -32.9,19 -32.9,-19" fill="#0d1122" stroke="url(#primaryGlow)" stroke-width="2.5" />

    <!-- SRE Sentinel Eye & Core Beam -->
    <path d="M -24 0 Q 0 -19 24 0 Q 0 19 -24 0 Z" fill="none" stroke="#ffffff" stroke-width="2.2" />
    <circle cx="0" cy="0" r="8" fill="url(#primaryGlow)" />
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" />

    <!-- Crosshair Nodes -->
    <line x1="-38" y1="0" x2="-68" y2="0" stroke="#ec4899" stroke-width="1.8" stroke-dasharray="3 4" />
    <line x1="38" y1="0" x2="68" y2="0" stroke="#06b6d4" stroke-width="1.8" stroke-dasharray="3 4" />
    <line x1="0" y1="-38" x2="0" y2="-68" stroke="#f43f5e" stroke-width="1.8" stroke-dasharray="3 4" />
    <line x1="0" y1="38" x2="0" y2="68" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="3 4" />
  </g>

  <!-- Title: S A O R I -->
  <text x="600" y="235" text-anchor="middle" fill="url(#primaryGlow)" class="title" font-size="52" filter="url(#softGlow)">S A O R I</text>

  <!-- Full Name Subtitle -->
  <text x="600" y="272" text-anchor="middle" fill="#f8fafc" class="subtitle" font-size="15">
    SERVER AUTONOMOUS ORCHESTRATOR FOR RESILIENT INFRASTRUCTURE
  </text>

  <!-- Tagline -->
  <text x="600" y="302" text-anchor="middle" fill="#94a3b8" class="tagline" font-size="14">
    Omnichannel Autonomous SRE Swarm · OmniAST &amp; Hermes Engine · Zero-Downtime Self-Healing Fleet
  </text>

  <!-- 4 Architecture Pillars Container -->
  <g transform="translate(600, 360)">
    <!-- Card 1: Triad Multi-Agent SRE -->
    <g transform="translate(-480, 0)">
      <rect x="0" y="0" width="225" height="46" rx="10" fill="url(#glassCard)" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="20" cy="23" r="6" fill="#ec4899" />
      <text x="36" y="20" fill="#f1f5f9" class="badge-title">Triad SRE Engine</text>
      <text x="36" y="35" fill="#94a3b8" class="badge-sub">Codex · Claude · Antigravity</text>
    </g>

    <!-- Card 2: Omnichannel Gateway -->
    <g transform="translate(-240, 0)">
      <rect x="0" y="0" width="225" height="46" rx="10" fill="url(#glassCard)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="20" cy="23" r="6" fill="#a855f7" />
      <text x="36" y="20" fill="#f1f5f9" class="badge-title">Omnichannel Gateway</text>
      <text x="36" y="35" fill="#94a3b8" class="badge-sub">Discord.js + Baileys + In-Game</text>
    </g>

    <!-- Card 3: OmniAST & Hermes Kernel -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="225" height="46" rx="10" fill="url(#glassCard)" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="20" cy="23" r="6" fill="#3b82f6" />
      <text x="36" y="20" fill="#f1f5f9" class="badge-title">OmniAST &amp; Hermes IR</text>
      <text x="36" y="35" fill="#94a3b8" class="badge-sub">Function Calling &amp; Knowledge Lake</text>
    </g>

    <!-- Card 4: Self-Healing & Staging Fleet -->
    <g transform="translate(240, 0)">
      <rect x="0" y="0" width="240" height="46" rx="10" fill="url(#glassCard)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="20" cy="23" r="6" fill="#10b981" />
      <text x="36" y="20" fill="#f1f5f9" class="badge-title">Zero-Downtime SRE</text>
      <text x="36" y="35" fill="#94a3b8" class="badge-sub">Staging Fleet &amp; SQLite WAL Locks</text>
    </g>
  </g>

  <!-- Terminal Bottom Footer Bar -->
  <g transform="translate(600, 448)">
    <rect x="-460" y="0" width="920" height="32" rx="7" fill="#090a12" stroke="#1e2238" stroke-width="1" />
    <circle cx="-438" cy="16" r="4.5" fill="#ef4444" opacity="0.85" />
    <circle cx="-422" cy="16" r="4.5" fill="#eab308" opacity="0.85" />
    <circle cx="-406" cy="16" r="4.5" fill="#22c55e" opacity="0.85" />
    <text x="10" y="21" text-anchor="middle" fill="#64748b" class="code-text">
      <tspan fill="#38bdf8">runtime:</tspan> sovereign_swarm · <tspan fill="#ec4899">models:</tspan> [gemini-3.8-flash, gpt-5.6-sol, claude-opus] · <tspan fill="#10b981">knowledge_lake:</tspan> 15,986 items indexed
    </text>
  </g>
</svg>
