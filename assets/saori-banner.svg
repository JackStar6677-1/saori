<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f" />
      <stop offset="50%" stop-color="#0f111a" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <!-- SAORI Neon Glow Gradient -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="35%" stop-color="#d946ef" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Core Orb Gradient -->
    <radialGradient id="coreOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1f2e" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0d0e17" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2e45" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#8b5cf6" fill-opacity="0.4" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; letter-spacing: 6px; }
    .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; letter-spacing: 2px; }
    .tagline { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; letter-spacing: 0.5px; }
    .code-text { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-size: 13px; font-weight: 600; }
    .badge-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="480" fill="url(#bgGradient)" />

  <!-- Cyber Grid -->
  <rect width="1200" height="480" fill="url(#cyberGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="600" cy="180" r="280" fill="url(#coreOrb)" />
  <circle cx="150" cy="80" r="180" fill="url(#coreOrb)" opacity="0.3" />
  <circle cx="1050" cy="400" r="220" fill="url(#coreOrb)" opacity="0.3" />

  <!-- Hexagonal Core Emblem Background -->
  <g transform="translate(600, 115)" filter="url(#neonFilter)">
    <!-- Outer Rings -->
    <circle cx="0" cy="0" r="64" fill="none" stroke="url(#primaryGlow)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />
    <circle cx="0" cy="0" r="52" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4" />
    
    <!-- Central Hexagon -->
    <polygon points="0,-36 31.18,-18 31.18,18 0,36 -31.18,18 -31.18,-18" fill="#121324" stroke="url(#primaryGlow)" stroke-width="2.5" />
    
    <!-- Eye / Oracle Symbol -->
    <path d="M -22 0 Q 0 -18 22 0 Q 0 18 -22 0 Z" fill="none" stroke="#ffffff" stroke-width="2" />
    <circle cx="0" cy="0" r="7" fill="url(#primaryGlow)" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />

    <!-- Connecting Ray Lines -->
    <line x1="-36" y1="0" x2="-64" y2="0" stroke="#d946ef" stroke-width="1.5" stroke-dasharray="2 4" />
    <line x1="36" y1="0" x2="64" y2="0" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="2 4" />
    <line x1="0" y1="-36" x2="0" y2="-64" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="2 4" />
    <line x1="0" y1="36" x2="0" y2="64" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="2 4" />
  </g>

  <!-- Title: S A O R I -->
  <text x="600" y="235" text-anchor="middle" fill="url(#primaryGlow)" class="title" font-size="52" filter="url(#softGlow)">S A O R I</text>

  <!-- Full Name Subtitle -->
  <text x="600" y="272" text-anchor="middle" fill="#f8fafc" class="subtitle" font-size="15">
    SERVER AUTONOMOUS ORCHESTRATOR FOR RESILIENT INFRASTRUCTURE
  </text>

  <!-- Tagline -->
  <text x="600" y="302" text-anchor="middle" fill="#94a3b8" class="tagline" font-size="14">
    Autonomous Multi-Agent DevOps, Self-Healing, Triage &amp; Zero-Downtime Staging for Game Servers
  </text>

  <!-- Badges / Pillars Container -->
  <g transform="translate(600, 360)">
    <!-- Pill 1: Multi-Agent Triage -->
    <g transform="translate(-460, 0)">
      <rect x="0" y="0" width="210" height="38" rx="19" fill="url(#cardBg)" stroke="#d946ef" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="20" cy="19" r="5" fill="#d946ef" />
      <text x="35" y="23" fill="#f1f5f9" class="badge-text">Tri-Agent Coordination</text>
    </g>

    <!-- Pill 2: Self-Healing Pipeline -->
    <g transform="translate(-230, 0)">
      <rect x="0" y="0" width="210" height="38" rx="19" fill="url(#cardBg)" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="20" cy="19" r="5" fill="#8b5cf6" />
      <text x="35" y="23" fill="#f1f5f9" class="badge-text">Self-Healing Pipeline</text>
    </g>

    <!-- Pill 3: Granular Lock Engine -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="38" rx="19" fill="url(#cardBg)" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="20" cy="19" r="5" fill="#06b6d4" />
      <text x="35" y="23" fill="#f1f5f9" class="badge-text">SQLite WAL Lock Engine</text>
    </g>

    <!-- Pill 4: Safe Staging Batch -->
    <g transform="translate(240, 0)">
      <rect x="0" y="0" width="220" height="38" rx="19" fill="url(#cardBg)" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="20" cy="19" r="5" fill="#10b981" />
      <text x="35" y="23" fill="#f1f5f9" class="badge-text">10/10 Safe Staging Batch</text>
    </g>
  </g>

  <!-- Terminal Bottom Footer Bar -->
  <g transform="translate(600, 435)">
    <rect x="-420" y="0" width="840" height="30" rx="6" fill="#090a12" stroke="#1e2238" stroke-width="1" />
    <circle cx="-400" cy="15" r="4" fill="#ef4444" opacity="0.8" />
    <circle cx="-386" cy="15" r="4" fill="#eab308" opacity="0.8" />
    <circle cx="-372" cy="15" r="4" fill="#22c55e" opacity="0.8" />
    <text x="0" y="20" text-anchor="middle" fill="#64748b" class="code-text">
      <tspan fill="#38bdf8">agent_pool:</tspan> [claude-code, codex, antigravity] · <tspan fill="#d946ef">mode:</tspan> adaptive · <tspan fill="#10b981">status:</tspan> battle-tested
    </text>
  </g>
</svg>
